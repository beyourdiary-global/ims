name: FTP Deploy CRM

on:
  push:
    branches:
      - main  # 或 master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
  server: ${{ secrets.FTP_HOST }}
  username: ${{ secrets.FTP_USERNAME }}
  password: ${{ secrets.FTP_PASSWORD }}
  local-dir: ./crm/        # ⚠️ 注意加 / 结尾
  server-dir: ${{ secrets.FTP_PATH }}/   # 服务器目录也要 /
  port: 21
  security: loose
  dry-run: true
