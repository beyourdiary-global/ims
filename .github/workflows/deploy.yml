name: Test FTP Secrets

on:
  workflow_dispatch:   # 手动触发

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Echo FTP Secrets
        run: |
           echo "HOST: ${{ secrets.FTP_HOST }}"
          echo "FTP_USERNAME: ${{ secrets.FTP_USERNAME }}"
          echo "FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}"
          echo "FTP_PATH: ${{ secrets.FTP_PATH }}"
