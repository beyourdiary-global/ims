name: FTP Deploy CRM FINAL (Git Diff + Sync Delete)

on:
  push:
    branches:
      - main
      - uat
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select branch to deploy (main or uat)'
        required: true
        default: 'uat'
        type: choice
        options:
          - main
          - uat

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      # 0️⃣ 设置分支 + FTP 账号
      - name: Set branch and FTP credentials
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DEPLOY_BRANCH="${{ github.event.inputs.branch }}"
          else
            DEPLOY_BRANCH="${GITHUB_REF##*/}"
          fi

          echo "🚀 Deploy branch: $DEPLOY_BRANCH"

          if [[ "$DEPLOY_BRANCH" == "main" ]]; then
            echo "FTP_USERNAME=${{ secrets.FTP_USERNAME }}" >> $GITHUB_ENV
            echo "FTP_PASSWORD=${{ secrets.FTP_PASSWORD }}" >> $GITHUB_ENV
          elif [[ "$DEPLOY_BRANCH" == "uat" ]]; then
            echo "FTP_USERNAME=${{ secrets.FTP_USERNAME_UAT }}" >> $GITHUB_ENV
            echo "FTP_PASSWORD=${{ secrets.FTP_PASSWORD_UAT }}" >> $GITHUB_ENV
          else
            echo "❌ Unsupported branch"
            exit 1
          fi

          echo "DEPLOY_BRANCH=$DEPLOY_BRANCH" >> $GITHUB_ENV

      # 1️⃣ Checkout（必须 fetch 历史）
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          fetch-depth: 2

      # 2️⃣ Debug（确认目录）
      - name: Debug project structure
        run: |
          echo "==== PROJECT STRUCTURE ===="
          ls -R

      # 3️⃣ 获取变更（新增/修改/删除）
      - name: Get changed files
        run: |
          echo "📦 Getting git changes..."

          git diff --name-status HEAD^ HEAD > changes.txt

          echo "---- ALL CHANGES ----"
          cat changes.txt

          # 上传文件
          grep '^[AM]' changes.txt | awk '{print $2}' > deploy_files.txt || true

          # 删除文件
          grep '^D' changes.txt | awk '{print $2}' > delete_files.txt || true

          echo "---- FILES TO UPLOAD ----"
          cat deploy_files.txt || true

          echo "---- FILES TO DELETE ----"
          cat delete_files.txt || true

      # 4️⃣ 准备 deploy 目录（只放 crm）
      - name: Prepare deploy folder
        run: |
          mkdir -p deploy

          while read file; do
            if [[ "$file" == public_html/crm/* && -f "$file" ]]; then
              TARGET="deploy/${file#public_html/crm/}"
              mkdir -p "$(dirname "$TARGET")"
              cp "$file" "$TARGET"
            fi
          done < deploy_files.txt

          echo "==== DEPLOY FILES ===="
          ls -R deploy || echo "No files"

      # 5️⃣ 上传变更文件
      - name: Upload changed files via FTP
        if: success()
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/crm/
          port: 21
          security: loose
          dry-run: false
          log-level: verbose

      # 6️⃣ 删除远程已删除文件 🔥
      - name: Delete removed files from server
        run: |
          if [ -s delete_files.txt ]; then
            echo "🗑 Deleting files on server..."

            sudo apt-get update
            sudo apt-get install -y lftp

            while read file; do
              if [[ "$file" == public_html/crm/* ]]; then
                REMOTE_PATH="/public_html/crm/${file#public_html/crm/}"
                echo "Deleting $REMOTE_PATH"

                lftp -u "${{ env.FTP_USERNAME }},${{ env.FTP_PASSWORD }}" ${{ secrets.FTP_HOST }} <<EOF
                rm "$REMOTE_PATH"
                bye
EOF
              fi
            done < delete_files.txt
          else
            echo "✅ No files to delete"
          fi
