name: Test FTP Secrets

on:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Show FTP Secrets
        run: |
          echo "HOST: ${{ secrets.FTP_HOST }}"
          echo "USERNAME: ${{ secrets.FTP_USERNAME }}"
          echo "PASSWORD: ${{ secrets.FTP_PASSWORD }}"
          echo "PATH: ${{ secrets.FTP_PATH }}"
