name: FTP Deploy CRM (Stable)

on:
  push:
    branches:
      - main          # 主分支
      - uat           # UAT 分支
  workflow_dispatch:  

concurrency:
  group: ftp-deploy-lock
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    # 🔐 manual approval per branch
    environment:
      name: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set branch config
        run: |
          BRANCH="${GITHUB_REF##*/}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

          if [[ "$BRANCH" == "main" ]]; then
            echo "FTP_USERNAME=${{ secrets.FTP_USERNAME }}" >> $GITHUB_ENV
            echo "FTP_PASSWORD=${{ secrets.FTP_PASSWORD }}" >> $GITHUB_ENV
            echo "SERVER_DIR=/" >> $GITHUB_ENV
          else
            echo "FTP_USERNAME=${{ secrets.FTP_USERNAME_UAT }}" >> $GITHUB_ENV
            echo "FTP_PASSWORD=${{ secrets.FTP_PASSWORD_UAT }}" >> $GITHUB_ENV
            echo "SERVER_DIR=/" >> $GITHUB_ENV
          fi

      # 🧪 DRY RUN (preview only)
      - name: Dry Run Deploy (Preview)
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ env.SERVER_DIR }}
          state-name: ${{ github.ref_name }}-ftp-state.json
          dry-run: true
          log-level: standard
          exclude: |
            .git/**
            .github/**
            node_modules/**

      # 🚀 REAL DEPLOY
      - name: Deploy to Server
        if: success()
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ env.SERVER_DIR }}
          state-name: ${{ github.ref_name }}-ftp-state.json
          dry-run: false
          log-level: minimal
          exclude: |
            .git/**
            .github/**
            node_modules/**
