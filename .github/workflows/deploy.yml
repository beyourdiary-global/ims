name: FTP Deploy CRM

on:
  push:
    branches:
      - main  # 或 master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./crm
          server-dir: ${{ secrets.FTP_PATH }}/   # 必须加 / 结尾
          port: 21
          security: loose
          dry-run: true    # 测试连接，不实际上传
