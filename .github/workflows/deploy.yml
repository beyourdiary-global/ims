name: FTP Deploy CRM LIVE 01-09-31

on:
  push:
    branches:
      - main
      - uat
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select branch to deploy (main or uat)'
        required: true
        default: 'uat'
        type: choice
        options:
          - main
          - uat

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      # 0️⃣ 设置部署分支和 FTP 凭据
      - name: Set branch and FTP credentials
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DEPLOY_BRANCH="${{ github.event.inputs.branch }}"
          else
            DEPLOY_BRANCH="${GITHUB_REF##*/}"
          fi

          echo "部署分支: $DEPLOY_BRANCH"

          if [[ "$DEPLOY_BRANCH" == "main" ]]; then
            echo "FTP_USERNAME=${{ secrets.FTP_USERNAME }}" >> $GITHUB_ENV
            echo "FTP_PASSWORD=${{ secrets.FTP_PASSWORD }}" >> $GITHUB_ENV
          elif [[ "$DEPLOY_BRANCH" == "uat" ]]; then
            echo "FTP_USERNAME=${{ secrets.FTP_USERNAME_UAT }}" >> $GITHUB_ENV
            echo "FTP_PASSWORD=${{ secrets.FTP_PASSWORD_UAT }}" >> $GITHUB_ENV
          else
            echo "Error: Unsupported branch $DEPLOY_BRANCH"
            exit 1
          fi

          echo "DEPLOY_BRANCH=$DEPLOY_BRANCH" >> $GITHUB_ENV

      # 1️⃣ Checkout 对应分支代码
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      # 1.1️⃣ 列出本地文件，确认 checkout 成功
      - name: List local files
        run: |
          echo "====== Local files ======"
          ls -R
          echo "========================"

      # 2️⃣ 测试 FTP 连接（dry-run）并保存上传文件列表
      - name: Test FTP connection (dry-run)
        id: dryrun
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./           # 根据实际部署目录修改
          server-dir: ${{ secrets.FTP_PATH }}
          port: 21
          security: loose
          dry-run: true
          log-level: verbose
          output-file: dryrun-files.txt
          exclude: |
            .git/**
            .github/**
            node_modules/**

      # 2.1️⃣ 安全检查：如果 dry-run 没文件，允许继续上传（首次部署）
      - name: Check dry-run result
        run: |
          if [ ! -s dryrun-files.txt ]; then
            echo "⚠️ No files detected in dry-run. Assuming first deploy, continuing..."
          else
            echo "✅ Files detected for upload:"
            cat dryrun-files.txt
          fi

      # 3️⃣ 正式上传（只上传变化文件）
      - name: Deploy /crm via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./           # 根据实际部署目录修改
          server-dir: ${{ secrets.FTP_PATH }}
          port: 21
          security: loose
          dry-run: false
          log-level: verbose
          only-changed: true
          exclude: |
            .git/**
            .github/**
            node_modules/**
