name: FTP Deploy CRM LIVE

on:
  push:
    branches:
      - main          # 主分支
      - uat           # UAT 分支
  workflow_dispatch:   # 支持手动触发

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      # 0️⃣ 检查分支并设置环境变量
      - name: Set FTP credentials based on branch
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "FTP_USERNAME=${{ secrets.FTP_USERNAME }}" >> $GITHUB_ENV
            echo "FTP_PASSWORD=${{ secrets.FTP_PASSWORD }}" >> $GITHUB_ENV
            echo "DEPLOY_BRANCH=main" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/uat" ]]; then
            echo "FTP_USERNAME=${{ secrets.FTP_USERNAME_UAT }}" >> $GITHUB_ENV
            echo "FTP_PASSWORD=${{ secrets.FTP_PASSWORD_UAT }}" >> $GITHUB_ENV
            echo "DEPLOY_BRANCH=uat" >> $GITHUB_ENV
          fi
          echo "当前分支: ${{ github.ref }}"
      
      # 1️⃣ Checkout 仓库代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ 测试 FTP 连接（dry-run: true）
      - name: Test FTP connection (dry-run)
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./                   # 本地 crm 文件夹，末尾一定要有 /
          server-dir: ${{ secrets.FTP_PATH }}/   # 远程路径，末尾一定要有 /
          port: 21
          security: loose                      # FTP，不是 SFTP
          dry-run: true                        # 先测试连接，不上传文件
          exclude: "**/.git*/**,**/.github*/**"
          log-level: verbose                   # 输出详细日志

      # 3️⃣ 正式上传（dry-run: false）
      - name: Deploy /crm via FTP
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/uat'
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_PATH }}/
          port: 21
          security: loose
          dry-run: false
          exclude: "**/.git*/**,**/.github*/**"
          log-level: verbose
